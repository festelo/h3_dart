name: Create tag and release

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: [h3_common, geojson2h3, h3_ffi, h3_web, h3_dart, h3_flutter]
        include:
          - package: h3_common
            release_name: "H3 Common"
          - package: geojson2h3
            release_name: "Geojson2H3"
          - package: h3_ffi
            release_name: "H3 Ffi"
          - package: h3_web
            release_name: "H3 Web"
          - package: h3_dart
            release_name: "H3 Dart"
          - package: h3_flutter
            release_name: "H3 Flutter"
            os: macos-latest
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pubspec Metadata
        uses: altive/pubspec-metadata@v1
        id: pubspec
        with:
          pubspec-file: ./${{ matrix.package }}/pubspec.yaml

      - name: Create tag
        env:
          TAG: ${{ matrix.package }}_${{ steps.pubspec.outputs.version-number }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null
          status=$?
          set -e
          case "$status" in
            0)
              echo "Tag ${TAG} already exists, nothing to do"
              exit 0
              ;;
            2)
              ;;
            *)
              echo "::error::Failed to query tags (git exit code $status)"
              exit "$status"
              ;;
          esac

          key_file="$(mktemp "${RUNNER_TEMP}/release_deploy_key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key_file"

          git tag "${TAG}" "${GITHUB_SHA}"
          GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

      - name: Create Github Release
        uses: ncipollo/release-action@v1
        id: release
        with:
          generateReleaseNotes: true
          name: "${{ matrix.release_name }} v${{ steps.pubspec.outputs.version-number }}"
          tag: "${{ matrix.package }}_${{ steps.pubspec.outputs.version-number }}"
          skipIfReleaseExists: true

      - name: Invoke pub workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: pub.yml
          ref: "${{ matrix.package }}_${{ steps.pubspec.outputs.version-number }}"
          inputs: '{ "package": "${{ matrix.package }}" }'
        if: steps.release.outputs.id != null
